name: KernelBuildKSUN

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig'
        required: true
        type: choice
        options:
          - earth_defconfig
          - earth_user_defconfig
          - earth-perf_defconfig

env:
  ARCH: arm64
  LINKER: ld.lld
  KVER: Beta
  TZ: Asia/Jakarta
  CODENAME: earth
  DEVICE: Redmi 12C/Poco C55 (earth)
  BUILDER: Kayasse
  BUILD_HOST: Restoration_0693
  FW: KSUN-SUSFS
  CLANG_DIR: ${{ github.workspace }}/clang
  ANY_KERNEL_DIR: ${{ github.workspace }}/anykernel
  OUT_DIR: ${{ github.workspace }}/out

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup environment variables
        run: |
          TIMESTAMP=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M%S")
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "ZIP_NAME=AK3-asterisk-${{ env.CODENAME }}-${TIMESTAMP}" >> $GITHUB_ENV
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> $GITHUB_ENV
          else
            echo "DEFCONFIG=earth_defconfig" >> $GITHUB_ENV
          fi
      
      - name: Setup ZRAM swap
        run: |
          echo "Setting up ZRAM swap..."
          
          # Check current memory
          echo "Current memory:"
          free -h
          
          # Try ZRAM first
          if lsmod | grep -q zram || sudo modprobe zram 2>/dev/null; then
            echo "Setting up ZRAM..."
            sudo zramctl --find --size 8G || \
            sudo bash -c 'echo 1 > /sys/block/zram0/reset 2>/dev/null; echo 8G > /sys/block/zram0/disksize 2>/dev/null'
            sudo mkswap /dev/zram0 2>/dev/null
            sudo swapon /dev/zram0 2>/dev/null
            
            if swapon --show | grep -q zram; then
              echo "✅ ZRAM swap enabled"
            fi
          fi
          
          # Fallback to regular swap
          if ! swapon --show | grep -q .; then
            echo "ZRAM not available, trying regular swap..."
            for SWAP_PATH in /mnt/swapfile /tmp/swapfile /swapfile; do
              echo "Trying ${SWAP_PATH}..."
              sudo rm -f ${SWAP_PATH} 2>/dev/null
              if sudo dd if=/dev/zero of=${SWAP_PATH} bs=1M count=4096 status=none 2>/dev/null; then
                sudo chmod 600 ${SWAP_PATH}
                sudo mkswap ${SWAP_PATH} 2>/dev/null
                if sudo swapon ${SWAP_PATH} 2>/dev/null; then
                  echo "✅ Regular swap enabled at ${SWAP_PATH}"
                  break
                fi
              fi
            done
          fi
          
          echo "Final memory status:"
          free -h
          swapon --show 2>/dev/null || echo "No swap active (will use conservative build settings)"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc curl zip python3 python3-pip \
            wget flex bison libssl-dev \
            device-tree-compiler cpio rsync kmod
          
          pip3 install requests
      
      - name: Cache AOSP Clang r596125
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: aosp-clang-r596125-v2
      
      - name: Download and setup AOSP Clang r596125
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading AOSP Clang r596125..."
          
          mkdir -p ${{ env.CLANG_DIR }}
          cd ${{ env.CLANG_DIR }}
          
          wget -q --show-progress \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz" \
            -O clang-r596125.tar.gz
          
          if [ ! -f clang-r596125.tar.gz ] || [ ! -s clang-r596125.tar.gz ]; then
            echo "❌ Download failed!"
            exit 1
          fi
          
          echo "Extracting Clang..."
          tar -xzf clang-r596125.tar.gz
          rm clang-r596125.tar.gz
          
          # Fix directory structure if needed
          if [ -d "clang-r596125" ]; then
            mv clang-r596125/* .
            rm -rf clang-r596125
          fi
          
          echo "Verifying Clang..."
          if [ -f "./bin/clang" ]; then
            echo "✅ Clang ready"
            ./bin/clang --version
          else
            echo "❌ Clang binary not found!"
            exit 1
          fi
      
      - name: Get build info
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"
          
          COMPILER_STRING=$(clang -v 2>&1 | head -n 1 | sed 's/(https..*//' | sed 's/ version//')
          echo "KBUILD_COMPILER_STRING=${COMPILER_STRING}" >> $GITHUB_ENV
          
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo "unknown")
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV
          
          echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log --format='%s' -n 1)" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git log --format='%h' -n 1)" >> $GITHUB_ENV
          echo "PROCS=$(nproc --all)" >> $GITHUB_ENV
      
      - name: Setup KernelSU-Next with SUSFS
        run: |
          echo "Setting up KernelSU-Next with SUSFS..."
          
          # Download and run the setup script
          curl -LSs "https://github.com/KernelSU-Next/KernelSU-Next/raw/refs/heads/legacy-susfs/kernel/setup.sh" | bash -
          
          # Check if setup succeeded
          if [ $? -eq 0 ]; then
            echo "✅ KernelSU-Next SUSFS setup complete"
          else
            echo "❌ KernelSU-Next setup failed!"
            
            # Check what's missing
            if [ ! -f "drivers/kernelsu/Kconfig" ]; then
              echo "Attempting manual setup..."
              
              # Remove empty directory
              rm -rf drivers/kernelsu 2>/dev/null
              
              # Clone KernelSU-Next legacy-susfs branch
              git clone --depth=1 --branch legacy-susfs \
                https://github.com/KernelSU-Next/KernelSU-Next.git \
                drivers/kernelsu_temp
              
              if [ -d "drivers/kernelsu_temp/kernel" ]; then
                # Move kernel files to correct location
                mkdir -p drivers/kernelsu
                cp -r drivers/kernelsu_temp/kernel/* drivers/kernelsu/
                rm -rf drivers/kernelsu_temp
                
                # Verify Kconfig exists
                if [ -f "drivers/kernelsu/Kconfig" ]; then
                  echo "✅ Manual KernelSU setup complete"
                else
                  echo "⚠️ Kconfig still missing, trying alternative..."
                  # Create minimal Kconfig as last resort
                  mkdir -p drivers/kernelsu
                  cat > drivers/kernelsu/Kconfig << 'EOF'
menu "KernelSU"
config KSU
	bool "KernelSU"
	default y
	help
	  KernelSU-Next with SUSFS support.
endmenu
EOF
                fi
              fi
            fi
          fi
          
          # Verify setup
          echo "Checking KernelSU files:"
          ls -la drivers/kernelsu/ 2>/dev/null || echo "⚠️ drivers/kernelsu/ not found"
          
          if [ -f "drivers/kernelsu/Kconfig" ]; then
            echo "✅ KernelSU Kconfig present"
          else
            echo "⚠️ KernelSU Kconfig missing, removing reference from drivers/Kconfig"
            sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig 2>/dev/null || true
          fi
      
      - name: Cache AnyKernel3
        id: cache-anykernel
        uses: actions/cache@v4
        with:
          path: ${{ env.ANY_KERNEL_DIR }}
          key: anykernel3-v2
      
      - name: Setup AnyKernel3
        if: steps.cache-anykernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ${{ env.ANY_KERNEL_DIR }}
      
      - name: Send Telegram notification (Build Started)
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            <b>⚡ ASTERISK KERNEL CI ⚡</b>
            <b>Build Started on ${{ env.BUILD_HOST }}</b>
            <b>Build status</b>: <code>${{ env.KVER }}</code>
            <b>Builder</b>: <code>${{ env.BUILDER }}</code>
            <b>Device</b>: <code>${{ env.DEVICE }}</code>
            <b>Kernel Version</b>: <code>${{ env.KERNEL_VERSION }}</code>
            <b>Date</b>: <code>$(TZ='${{ env.TZ }}' date)</code>
            <b>Zip Name</b>: <code>${{ env.ZIP_NAME }}</code>
            <b>Defconfig</b>: <code>${{ env.DEFCONFIG }}</code>
            <b>Compiler</b>: <code>${{ env.KBUILD_COMPILER_STRING }}</code>
            <b>Branch</b>: <code>${{ env.BRANCH }}</code>
            <b>Last Commit</b>: <code>${{ env.COMMIT_MSG }}: ${{ env.COMMIT_HASH }}</code>
      
      - name: Build kernel
        id: build
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"
          export KBUILD_BUILD_USER=${{ env.BUILDER }}
          export KBUILD_BUILD_HOST=${{ env.BUILD_HOST }}
          export LOCALVERSION=""
          
          echo "Compiler version:"
          clang --version
          
          # Calculate safe job count
          TOTAL_MEM_MB=$(free -m | awk '/^Mem:/{print $2}')
          SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
          EFFECTIVE_MEM=$((TOTAL_MEM_MB + SWAP_MB))
          
          if [ $EFFECTIVE_MEM -ge 12288 ]; then
            JOBS=4
          elif [ $EFFECTIVE_MEM -ge 8192 ]; then
            JOBS=3
          elif [ $EFFECTIVE_MEM -ge 6144 ]; then
            JOBS=2
          else
            JOBS=1
          fi
          
          echo "Memory: ${TOTAL_MEM_MB}MB RAM + ${SWAP_MB}MB Swap = ${EFFECTIVE_MEM}MB"
          echo "Using ${JOBS} parallel jobs"
          
          # Create output directory
          mkdir -p ${{ env.OUT_DIR }}
          
          # Generate config
          echo "Generating config with defconfig: ${{ env.DEFCONFIG }}"
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          
          # Record start time
          START=$(date +"%s")
          
          # Build kernel
          echo "Starting kernel compilation..."
          make -j${JOBS} \
            O=${{ env.OUT_DIR }} \
            LLVM=1 \
            ARCH=${{ env.ARCH }} \
            LD=${{ env.LINKER }} \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            CONFIG_DEBUG_SECTION_MISMATCH=y \
            V=0 2>&1 | tee ${{ env.OUT_DIR }}/build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          
          END=$(date +"%s")
          DIFF=$((END - START))
          MINUTES=$((DIFF / 60))
          SECONDS=$((DIFF % 60))
          echo "BUILD_MINUTES=${MINUTES}" >> $GITHUB_ENV
          echo "BUILD_SECONDS=${SECONDS}" >> $GITHUB_ENV
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "❌ Build failed with exit code: ${BUILD_EXIT}"
            exit 1
          fi
          
          # Verify kernel image
          if [ -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ]; then
            echo "✅ Found Image.gz-dtb"
            echo "KERNEL_IMAGE=Image.gz-dtb" >> $GITHUB_ENV
          elif [ -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz" ]; then
            echo "✅ Found Image.gz"
            echo "KERNEL_IMAGE=Image.gz" >> $GITHUB_ENV
          elif [ -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image" ]; then
            echo "✅ Found Image"
            echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "❌ No kernel image found!"
            ls -la ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/
            exit 1
          fi
          
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          echo "✅ Build completed in ${MINUTES}m ${SECONDS}s"
      
      - name: Send Telegram notification (Build Failed)
        if: failure()
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          document: ${{ env.OUT_DIR }}/build.log
          message: Build failed after ${{ env.BUILD_MINUTES }} minutes and ${{ env.BUILD_SECONDS }} seconds.
      
      - name: Package kernel zip
        if: success()
        run: |
          echo "Creating kernel zip..."
          
          cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE }} ${{ env.ANY_KERNEL_DIR }}/
          
          cd ${{ env.ANY_KERNEL_DIR }}
          zip -r9 ${{ env.ZIP_NAME }}.zip * -x .git README.md *placeholder
          
          SHA512=$(sha512sum ${{ env.ZIP_NAME }}.zip | cut -f1 -d ' ')
          echo "KERNEL_SHA512=${SHA512}" >> $GITHUB_ENV
          
          mkdir -p ${{ env.OUT_DIR }}/target
          mv ${{ env.ZIP_NAME }}.zip ${{ env.OUT_DIR }}/target/
          
          rm -f ${{ env.ANY_KERNEL_DIR }}/${{ env.KERNEL_IMAGE }}
      
      - name: Upload kernel zip artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.OUT_DIR }}/target/${{ env.ZIP_NAME }}.zip
          retention-days: 7
      
      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.TIMESTAMP }}
          path: ${{ env.OUT_DIR }}/build.log
          retention-days: 3
      
      - name: Send Telegram notification (Build Success)
        if: success()
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ✅ Build completed successfully!
            Build took ${{ env.BUILD_MINUTES }} minutes and ${{ env.BUILD_SECONDS }} seconds.
            <b>SHA512</b>: <code>${{ env.KERNEL_SHA512 }}</code>
          document: ${{ env.OUT_DIR }}/target/${{ env.ZIP_NAME }}.zip
