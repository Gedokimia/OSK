name: Asterisk Kernel Builder

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig'
        required: true
        type: choice
        options:
          - earth_defconfig
          - earth_user_defconfig
          - earth-perf_defconfig
      send_telegram:
        description: 'Send notification to Telegram'
        required: false
        type: boolean
        default: true
      clean_build:
        description: 'Clean build (make clean)'
        required: false
        type: boolean
        default: false

env:
  ARCH: arm64
  LINKER: ld.lld
  KVER: Beta
  TZ: Asia/Jakarta
  CODENAME: earth
  DEVICE: Redmi 12C/Poco C55 (earth)
  BUILDER: Kayasse
  BUILD_HOST: Restoration_0693
  FW: KSUN-SUSFS
  KERNEL_DIR: ${{ github.workspace }}/kernel
  CLANG_DIR: ${{ github.workspace }}/clang
  ANY_KERNEL_DIR: ${{ github.workspace }}/anykernel
  OUT_DIR: ${{ github.workspace }}/out

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup environment variables
        id: env_vars
        run: |
          TIMESTAMP=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M%S")
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "ZIP_NAME=AK3-asterisk-${{ env.CODENAME }}-${TIMESTAMP}" >> $GITHUB_ENV
          
          # Set defconfig based on input or default
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> $GITHUB_ENV
          else
            echo "DEFCONFIG=earth_defconfig" >> $GITHUB_ENV
          fi
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            bc \
            curl \
            zip \
            python3 \
            python3-pip \
            wget \
            flex \
            bison \
            libssl-dev
          
          # Install Python requests for Telegram uploads
          pip3 install requests
      
      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-aosp-17.0.4
      
      - name: Clone Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          cd ${{ env.CLANG_DIR }}
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2023/clang-r498229b.tar.gz
          tar -xzf clang-r498229b.tar.gz
          rm clang-r498229b.tar.gz
      
      - name: Cache AnyKernel3
        id: cache-anykernel
        uses: actions/cache@v4
        with:
          path: ${{ env.ANY_KERNEL_DIR }}
          key: anykernel3-master
      
      - name: Clone AnyKernel3
        if: steps.cache-anykernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ${{ env.ANY_KERNEL_DIR }}
      
      - name: Setup kernel source
        run: |
          mkdir -p ${{ env.KERNEL_DIR }}
          # Copy kernel source to KERNEL_DIR
          # If kernel source is in subdirectory, adjust accordingly
          if [ -f "Makefile" ]; then
            # This means kernel source is in the repo root
            rsync -av --exclude='.git' --exclude='out' --exclude='clang' --exclude='anykernel' ./ ${{ env.KERNEL_DIR }}/
          else
            # Assume kernel source is in a subdirectory
            rsync -av --exclude='.git' --exclude='out' --exclude='clang' --exclude='anykernel' ./kernel/ ${{ env.KERNEL_DIR }}/
          fi
      
      - name: Setup environment
        run: |
          # Add Clang to PATH
          echo "${{ env.CLANG_DIR }}/bin" >> $GITHUB_PATH
          
          # Get compiler string
          COMPILER_STRING=$(${{ env.CLANG_DIR }}/bin/clang -v 2>&1 | head -n 1 | sed 's/(https..*//' | sed 's/ version//')
          echo "KBUILD_COMPILER_STRING=${COMPILER_STRING}" >> $GITHUB_ENV
          
          # Get kernel version
          cd ${{ env.KERNEL_DIR }}
          KERNEL_VERSION=$(make kernelversion 2>/dev/null)
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV
          
          # Get git info
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          COMMIT_MSG=$(git log --format="%s" -n 1)
          COMMIT_HASH=$(git log --format="%h" -n 1)
          echo "BRANCH=${BRANCH}" >> $GITHUB_ENV
          echo "COMMIT_MSG=${COMMIT_MSG}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          
          # Get number of CPU cores
          PROCS=$(nproc --all)
          echo "PROCS=${PROCS}" >> $GITHUB_ENV
      
      - name: Send Telegram notification (Build Started)
        if: ${{ github.event.inputs.send_telegram != 'false' }}
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            <b>⚡ ASTERISK KERNEL CI ⚡</b>
            <b>Build Started on ${{ env.BUILD_HOST }}</b>
            <b>Build status</b>: <code>${{ env.KVER }}</code>
            <b>Builder</b>: <code>${{ env.BUILDER }}</code>
            <b>Device</b>: <code>${{ env.DEVICE }}</code>
            <b>Kernel Version</b>: <code>${{ env.KERNEL_VERSION }}</code>
            <b>Date</b>: <code>$(TZ='Asia/Jakarta' date)</code>
            <b>Zip Name</b>: <code>${{ env.ZIP_NAME }}</code>
            <b>Defconfig</b>: <code>${{ env.DEFCONFIG }}</code>
            <b>Compiler</b>: <code>${{ env.KBUILD_COMPILER_STRING }}</code>
            <b>Branch</b>: <code>${{ env.BRANCH }}</code>
            <b>Last Commit</b>: <code>${{ env.COMMIT_MSG }}: ${{ env.COMMIT_HASH }}</code>
      
      - name: Clean build (optional)
        if: ${{ github.event.inputs.clean_build == 'true' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          make O=${{ env.OUT_DIR }} clean
          make O=${{ env.OUT_DIR }} mrproper
      
      - name: Build kernel
        id: build
        run: |
          cd ${{ env.KERNEL_DIR }}
          
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"
          export KBUILD_BUILD_USER=${{ env.BUILDER }}
          export KBUILD_BUILD_HOST=${{ env.BUILD_HOST }}
          export LOCALVERSION=""
          
          # Create output directory
          mkdir -p ${{ env.OUT_DIR }}
          
          # Generate .config
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          
          # Record start time
          START=$(date +"%s")
          
          # Compile kernel
          make -j${{ env.PROCS }} \
            O=${{ env.OUT_DIR }} \
            LLVM=1 \
            ARCH=${{ env.ARCH }} \
            LD=${{ env.LINKER }} \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            CONFIG_DEBUG_SECTION_MISMATCH=y \
            V=0 2>&1 | tee ${{ env.OUT_DIR }}/build.log
          
          # Record end time and calculate duration
          END=$(date +"%s")
          DIFF=$((END - START))
          MINUTES=$((DIFF / 60))
          SECONDS=$((DIFF % 60))
          echo "BUILD_MINUTES=${MINUTES}" >> $GITHUB_ENV
          echo "BUILD_SECONDS=${SECONDS}" >> $GITHUB_ENV
          
          # Check if build was successful
          if [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ] && [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz" ]; then
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            exit 1
          fi
          
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
      
      - name: Send Telegram notification (Build Failed)
        if: ${{ failure() && github.event.inputs.send_telegram != 'false' }}
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          document: ${{ env.OUT_DIR }}/build.log
          message: |
            Build failed after ${{ env.BUILD_MINUTES }} minutes and ${{ env.BUILD_SECONDS }} seconds.
      
      - name: Package kernel zip
        if: ${{ success() }}
        run: |
          # Copy kernel image to AnyKernel3
          if [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ]; then
            cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz ${{ env.ANY_KERNEL_DIR }}/
          else
            cp ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb ${{ env.ANY_KERNEL_DIR }}/
          fi
          
          # Create zip
          cd ${{ env.ANY_KERNEL_DIR }}
          zip -r9 ${{ env.ZIP_NAME }}.zip * -x .git README.md *placeholder
          
          # Generate checksum
          SHA512=$(sha512sum ${{ env.ZIP_NAME }}.zip | cut -f1 -d ' ')
          echo "KERNEL_SHA512=${SHA512}" >> $GITHUB_ENV
          
          # Move zip to output
          mkdir -p ${{ env.OUT_DIR }}/target
          mv ${{ env.ZIP_NAME }}.zip ${{ env.OUT_DIR }}/target/
          
          # Clean up
          if [ ! -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb" ]; then
            rm -f ${{ env.ANY_KERNEL_DIR }}/Image.gz
          else
            rm -f ${{ env.ANY_KERNEL_DIR }}/Image.gz-dtb
          fi
      
      - name: Upload kernel zip artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.OUT_DIR }}/target/${{ env.ZIP_NAME }}.zip
          retention-days: 7
      
      - name: Upload build log artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.OUT_DIR }}/build.log
          retention-days: 3
      
      - name: Send Telegram notification (Build Success)
        if: ${{ success() && github.event.inputs.send_telegram != 'false' }}
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          document: ${{ env.OUT_DIR }}/target/${{ env.ZIP_NAME }}.zip
          message: |
            Build took ${{ env.BUILD_MINUTES }} minutes and ${{ env.BUILD_SECONDS }} seconds.
            <b>SHA512</b>: <code>${{ env.KERNEL_SHA512 }}</code>
